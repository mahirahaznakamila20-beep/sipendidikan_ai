<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="theme-color"
    content="#2f6b3b"
  />

  <title>siPENDIdikan_AI</title>

  <!-- Google Font -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Main CSS -->
  <link
    rel="stylesheet"
    href="css/style.css"
  />
</head>

<body>

  <div class="app-shell">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside
      class="sidebar"
      id="sidebar"
    >

      <div class="brand">

        <div class="brand-logo">
          <div class="brand-icon">
            AI
          </div>

          <div>
     
          <h1 class="brand-title">
            si<span class="brand-highlight">PENDI</span>dikan_AI
          </h1>
            <p>
              Smart Islamic Platform for
              Educators &amp; Digital Learning
            </p>
          </div>

        </div>

      </div>

      <!-- Navigation -->
      <nav
        id="navMenu"
        class="nav-menu"
      >
      </nav>

    </aside>

    <!-- =========================
         MAIN PANEL
    ========================== -->

    <main class="main-panel">

      <!-- =========================
           TOPBAR
      ========================== -->

      <header class="topbar">

        <div class="topbar-left">

          <div class="welcome-wrapper">

            <span id="welcomeText">
              Selamat datang di
              siPENDIdikan_AI
            </span>

          </div>

        </div>

        <div class="topbar-right">

          <button
            class="btn btn-secondary"
            id="logoutButton"
          >
            Logout
          </button>

        </div>

      </header>

      <!-- =========================
           LOGIN
      ========================== -->

      <section
        class="page page-active"
        id="page-login"
      >

        <div class="card card-auth">

          <h2>Login</h2>

          <form id="loginForm" method="post" action="/api/auth/login">

            <label>
              Email / Username / NISN
            </label>

            <input
              type="text"
              name="identifier"
              required
            />

            <label>Password</label>

            <input
              type="password"
              name="password"
              required
            />

            <label>Role</label>

            <select
              name="role"
              required
            >
              <option value="guru">
                Guru
              </option>

              <option value="admin">
                Admin
              </option>

              <option value="siswa">
                Siswa
              </option>
            </select>

            <button
              class="btn btn-primary"
              type="submit"
            >
              Login
            </button>

            <div class="link-row">

              <a href="#" id="showRegister">
                Register
              </a>

              <a href="#" id="showForgot">
                Lupa Password
              </a>

            </div>

            <div
              class="message"
              id="loginMessage"
            >
            </div>

          </form>

        </div>

      </section>

      <!-- =========================
           REGISTER
      ========================== -->

      <section
        class="page"
        id="page-register"
      >

        <div class="card card-auth">

          <h2>Register Guru</h2>

          <form id="registerForm" method="post" action="/api/auth/register">

            <label>Username</label>

            <input
              type="text"
              name="username"
              required
            />

            <label>Email</label>

            <input
              type="email"
              name="email"
              required
            />

            <label>Password</label>

            <input
              type="password"
              name="password"
              required
            />

            <label>NPSN Sekolah</label>

            <input
              type="text"
              name="npsn"
              required
            />

            <button
              class="btn btn-primary"
              type="submit"
            >
              Daftar
            </button>

            <div class="link-row">

              <a
                href="#"
                id="showLoginFromRegister"
              >
                Kembali ke Login
              </a>

            </div>

            <div
              class="message"
              id="registerMessage"
            >
            </div>

          </form>

        </div>

      </section>

      <!-- =========================
           FORGOT PASSWORD
      ========================== -->

      <section
        class="page"
        id="page-forgot"
      >

        <div class="card card-auth">

          <h2>Lupa Password</h2>

          <form id="forgotForm" method="post" action="/api/auth/password-reset">

            <label>Email</label>

            <input
              type="email"
              name="email"
              required
            />

            <button
              class="btn btn-primary"
              type="submit"
            >
              Kirim Reset
            </button>

            <div class="link-row">

              <a
                href="#"
                id="showLoginFromForgot"
              >
                Kembali ke Login
              </a>

            </div>

            <div
              class="message"
              id="forgotMessage"
            >
            </div>

          </form>

        </div>

      </section>

      <!-- =========================
           DASHBOARD
      ========================== -->

      <section
        class="page"
        id="page-dashboard"
      >

        <div class="dashboard-grid">

          <div class="dashboard-header">

            <h2 id="dashboardTitle">
              Dashboard
            </h2>

            <p id="dashboardSubtitle">
              Akses cepat untuk role Anda.
            </p>

          </div>

          <div
            class="dashboard-content"
            id="dashboardContent"
          >
          </div>

        </div>

      </section>

    </main>

  </div>

  <!-- Main JS -->
  <script src="js/app.js"></script>

</body>
</html>
